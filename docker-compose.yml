
services:
  postgres:
    image: postgres:16
    container_name: income-expense-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker_user -d income_expense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
